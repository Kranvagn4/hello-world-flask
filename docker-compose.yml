services:

  db:
    image: postgres:16-alpine
    container_name: hello-postgres

    environment:
      POSTGRES_DB: hellodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hellodb"]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build: .
    container_name: hello-flask

    ports:
      - "5000:5000"

    environment:
      DB_HOST: db
      DB_NAME: hellodb
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432

    depends_on:
      db:
        condition: service_healthy


volumes:
  postgres_data: