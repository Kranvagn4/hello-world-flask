---
- name: Configure Flask Runtime Environment
  hosts: local
  become: true

  tasks:

    - name: Update package repository
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - python3
          - python3-pip
          - curl
        state: present

    - name: Create application user
      user:
        name: flaskapp
        state: present
        create_home: yes

    - name: Create application directory
      file:
        path: /opt/hello-world-flask
        state: directory
        owner: flaskapp
        group: flaskapp
        mode: '0755'

    - name: Create application configuration file
      copy:
        dest: /opt/hello-world-flask/config.txt
        content: |
          Application=Hello World Flask
          Environment=Production
        owner: flaskapp
        group: flaskapp
        mode: '0644'
